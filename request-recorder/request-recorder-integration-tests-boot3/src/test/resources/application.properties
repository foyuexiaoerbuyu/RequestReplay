spring.application.name=request-recorder-it-boot3
server.error.include-message=always

request-recorder.enabled=true
request-recorder.project-code=it-boot3
request-recorder.project-name=RequestRecorder 集成测试
request-recorder.auto-init-schema=true
request-recorder.max-body-size=256
request-recorder.exclude-paths=/skip/**

request-recorder.database.jdbc-url=jdbc:h2:mem:it_boot3;DB_CLOSE_DELAY=-1;MODE=MySQL
request-recorder.database.driver-class-name=org.h2.Driver
request-recorder.database.username=sa
request-recorder.database.password=

request-recorder.async.enabled=true
request-recorder.async.workers=2
request-recorder.async.queue-capacity=200
